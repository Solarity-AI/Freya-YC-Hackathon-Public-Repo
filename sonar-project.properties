sonar.projectKey=freya-builder
sonar.projectName=Freya builder
sonar.sources=builder,runtime,harness
sonar.tests=tests
sonar.exclusions=kit/**,docs/**,results/**,runs/**,state/**,**/prompts/**
# coverage.xml is written by tools/quality.sh with repo-relative paths (builder/__init__.py, not __init__.py), so the
# Cobertura sensor resolves every file, including the three top-level __init__.py files.
sonar.python.coverage.reportPaths=coverage.xml
# The scanner waits for the server-side quality gate and exits non-zero unless it is OK (tools/quality.sh checks).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.sourceEncoding=UTF-8
# Accepted findings (quality round 2026-10-11; the scanner token cannot set issue status, so they are declared here):
# e1 S9073 composite assertions in tests: one assert checks several properties of one scenario result on purpose.
# e2 S3776 cognitive complexity in runtime/: brain/ident/parse are bundled into ONE packed ctl code node that runs every
#    turn under the platform's 131072-byte code+data limit; their phase/classifier functions mirror CONTRACTS C.4-C.6
#    decision tables 1:1, and splitting them costs bytes and per-turn call overhead (behaviour pinned by ~99.9% tests).
# e4-e11 S3776 cognitive complexity in the builder's readers (ingest/contract/openapi_model/build/graph/lint/segment) and
#    harness/chat_e2e.py: not refactored before the final (hackathon deadline); behaviour pinned by tests.
# e12 S107 harness/chat_e2e.run_case parameter count: one CLI-facing entry point (hackathon deadline; pinned by tests).
# e3 S7498 dict()/set() constructors in runtime/: kept for brace safety (a nested literal can put "}}" into the
#    ctl code, which the Freya template engine would read as a placeholder).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S9073
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=runtime/**
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S7498
